services:
  db:
    image: postgres:16-alpine
    ports:
    - "5432:5432"
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  importer:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node -r dotenv/config scripts/seed-admin.cjs && node -r dotenv/config scripts/seed-demo-data.cjs && node -r dotenv/config scripts/sync-match-threads.cjs

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8012:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
